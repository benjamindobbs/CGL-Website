<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
            <div class="contact-buttons">
                <a href="mailto:contact@madein.school" class="btn">
                    <span class="material-symbols-outlined">mail</span> Email
                </a>
                <a href="tel:18605132398" class="btn">
                    <span class="material-symbols-outlined">call</span> Call
                </a>
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/order/" class="nav-tab" aria-current="page">Shop</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Dashboard</a>
            <a href="/info/" class="nav-tab">About CGL</a>
        </nav>
    </div>

    <main class="form-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div class="order-grid" id="order-ui" style="display:none;">

            <section class="config-card">
                <h2>1. Configure Item</h2>

                <div class="form-group">
                    <label for="product">Uniform Item</label>
                    <select id="product" required>
                        <option value="" disabled selected>Select Item</option>
                    </select>
                </div>

                <p id="product-detail" class="placeholder-text" style="display:none;"></p>

                <div class="form-group">
                    <label>Color</label>
                    <div id="color-swatch-container" class="swatch-grid">
                        <p class="placeholder-text">Please select an item first...</p>
                    </div>
                    <input type="hidden" id="selected-color">
                </div>

                <div class="form-group" id="size-group" style="display:none;">
                    <label for="size">Size</label>
                    <select id="size">
                        <option value="" disabled selected>Select Size</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <div class="quantity-controls">
                        <button type="button" onclick="changeQty(-1)">−</button>
                        <input type="number" id="quantity" value="1" min="1" readonly>
                        <button type="button" onclick="changeQty(1)">+</button>
                    </div>
                </div>

                <div class="line-item-preview">
                    <p>Item Subtotal: <span id="line-item-total">$0</span></p>
                </div>

                <button type="button" id="add-to-cart-btn" class="secondary-btn">
                    Add Item to Order
                </button>
            </section>

            <section class="config-card">
                <h2>2. Your Cart</h2>

                <form id="master-order-form">

                    <div id="cart-items-display">
                        <p class="placeholder-text">Your cart is empty.</p>
                    </div>

                    <div class="price-display">
                        <span>Grand Total:</span>
                        <span id="total-price">$0</span>
                    </div>

                    <hr class="form-divider">

                    <h2>3. Customer Details</h2>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" name="name" id="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email" placeholder="12345@students.hartfordschools.org"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="student_id">Student ID (Optional)</label>
                        <input type="text" name="student_id" id="student_id">
                    </div>

                    <p id="order-status" style="display:none;color:#c0392b;font-weight:600;"></p>

                    <button type="button" id="submit-order-btn" class="submit-btn" onclick="submitFinalOrder()">
                        Place Order
                    </button>
                </form>
            </section>

        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/order-form.js"></script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
