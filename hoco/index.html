<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HoCo Tickets</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
</head>

<body class="form-page hoco-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
            <div class="contact-buttons">
                <a href="mailto:contact@madein.school" class="btn">
                    <span class="material-symbols-outlined">mail</span> Email
                </a>
                <a href="tel:18605132398" class="btn">
                    <span class="material-symbols-outlined">call</span> Call
                </a>
                <a href="/signin/" class="btn" id="auth-btn">
                    <span class="material-symbols-outlined" id="auth-btn-icon">login</span>
                    <span id="auth-btn-label">Sign In</span>
                </a>
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/order/" class="nav-tab">Shop</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Dashboard</a>
            <a href="/info/" class="nav-tab">About CGL</a>
        </nav>
    </div>

    <main class="hoco">
        <section class="hoco-hero">
            <span class="hoco-kicker">Homecoming 2026</span>
            <h1>Caribbean Carnival</h1>
        </section>

        <div class="ticket-stage">
            <img class="ticket-stub" src="/assets/hoco/ticket-stub.webp" width="1296" height="432"
                alt="HoCo Carnival ticket">
        </div>

        <p id="loading-status" class="hoco-status">Checking sign-in&hellip;</p>

        <section class="hoco-card" id="hoco-ui" hidden>
            <form id="hoco-form">
                <div class="hoco-price-row">
                    <div>
                        <h2 id="ticket-name">HoCo Ticket</h2>
                        <p id="ticket-detail" class="hoco-detail"></p>
                    </div>
                    <span class="hoco-unit-price" id="unit-price">$0.00</span>
                </div>

                <div class="form-group">
                    <label>Tickets</label>
                    <div class="quantity-controls">
                        <button type="button" data-qty="-1" aria-label="One fewer ticket">−</button>
                        <input type="number" id="quantity" value="1" min="1" readonly>
                        <button type="button" data-qty="1" aria-label="One more ticket">+</button>
                    </div>
                    <small class="field-note" id="ticket-limit"></small>
                </div>

                <div class="price-display">
                    <span>Total:</span>
                    <span id="total-price">$0.00</span>
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="12345@students.hartfordschools.org" required>
                </div>

                <div class="form-group">
                    <label for="student_id">Student ID (Optional)</label>
                    <input type="text" id="student_id">
                </div>

                <p id="order-status" class="hoco-error" hidden></p>

                <button type="submit" id="submit-order-btn" class="submit-btn">
                    <span class="material-symbols-outlined">confirmation_number</span>
                    Buy Tickets
                </button>
            </form>
        </section>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/hoco-form.js"></script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
