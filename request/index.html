<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request a Job</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
            <div class="contact-buttons">
                <a href="mailto:contact@madein.school" class="btn">
                    <span class="material-symbols-outlined">mail</span> Email
                </a>
                <a href="tel:18605132398" class="btn">
                    <span class="material-symbols-outlined">call</span> Call
                </a>
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Tools</a>
            <a href="/admin/orders/" class="nav-tab staff-only" hidden>Orders</a>
            <a href="/admin/items/" class="nav-tab staff-only" hidden>Item Catalog</a>
            <a href="/admin/restock/" class="nav-tab staff-only" hidden>Restock</a>
            <a href="/admin/storefront/" class="nav-tab staff-only" hidden>Storefront</a>
        </nav>
    </div>

    <main class="form-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div class="order-form" id="app-ui" style="display:none;">
            <h2>Request a Job</h2>
            <p>For Hartford school staff. Tell us what you need and our student team will follow up by email.</p>

            <div class="form-group">
                <label for="requester-name">Your Name</label>
                <input type="text" id="requester-name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="requester-email">Email</label>
                <input type="email" id="requester-email" readonly>
            </div>

            <div class="form-group">
                <label for="job-name">Job Name</label>
                <input type="text" id="job-name" placeholder="e.g. 8th Grade Field Day Shirts" required>
            </div>

            <div class="form-group">
                <label for="building">School / Building</label>
                <input type="text" id="building" placeholder="e.g. Classical Magnet School">
            </div>

            <div class="form-group">
                <label for="phone">Phone (building line + extension)</label>
                <input type="text" id="phone" placeholder="e.g. 59169">
            </div>

            <div class="form-group">
                <label for="category" data-info="Not sure which process you need? Pick “Not sure yet” and our team will help you choose.">Print Process</label>
                <select id="category" required>
                    <option value="" disabled selected>Select a process</option>
                </select>
                <small id="category-desc" class="field-note" style="display:none;"></small>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="text" id="quantity" placeholder="e.g. 120, or 50–75">
            </div>

            <div class="form-group">
                <label for="needed-by">Needed By</label>
                <input type="date" id="needed-by">
            </div>

            <div class="form-group">
                <label for="description">What do you need made?</label>
                <textarea id="description" rows="4" placeholder="Describe the items, sizes/colors if known, and any details about the artwork or text."></textarea>
            </div>

            <div class="form-group">
                <label for="files">Artwork (optional)</label>
                <input type="file" id="files" multiple
                    accept="image/png,image/jpeg,application/pdf,.svg,.eps,.ai">
                <small class="field-note">PNG, JPG, PDF, SVG, EPS or AI. Up to 5 files, 25&nbsp;MB each.</small>
            </div>

            <p id="request-status" style="display:none;font-weight:600;"></p>

            <button type="button" id="submit-request-btn" class="submit-btn">
                <span class="material-symbols-outlined">send</span>
                Submit Request
            </button>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/district-guard.js"></script>
    <script src="/scripts/info-tip.js"></script>
    <script src="/scripts/request-form.js"></script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
