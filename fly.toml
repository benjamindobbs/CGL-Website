# fly.toml app configuration file for cgl-website
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Managing the staff whitelist (who can use /admin/*) after deploy, without a
# redeploy — run from a machine with flyctl authenticated against this app:
#   fly ssh console -a cgl-website -C "node server/manage-staff.js add someone@hartfordschools.org"
#   fly ssh console -a cgl-website -C "node server/manage-staff.js add someone@students.hartfordschools.org"
#   fly ssh console -a cgl-website -C "node server/manage-staff.js remove someone@hartfordschools.org"
#   fly ssh console -a cgl-website -C "node server/manage-staff.js list"
# (fly ssh console starts a machine if none is running, since
# min_machines_running = 0 below lets it fully scale to zero when idle.)
#
# Stripe (online order payments). Set as secrets, never in [env]:
#   fly secrets set -a cgl-website \
#     STRIPE_SECRET_KEY=sk_live_xxx \
#     STRIPE_WEBHOOK_SECRET=whsec_xxx \
#     PUBLIC_BASE_URL=https://cgl-website.fly.dev
# STRIPE_WEBHOOK_SECRET comes from the Stripe dashboard endpoint you add at
#   https://<PUBLIC_BASE_URL>/api/payments/webhook
# subscribed to: checkout.session.completed, checkout.session.expired
# Until all three are set, isStripeConfigured() is false and any order with a
# nonzero total is refused with a 503 (the site still runs; $0 orders still work).
# Local dev:
#   stripe listen --forward-to localhost:8080/api/payments/webhook
#   (use the whsec_ it prints, plus PUBLIC_BASE_URL=http://localhost:8080)
#
# Job-request emails (Resend). Sending domain madein.school is verified in Resend.
#   fly secrets set -a cgl-website RESEND_API_KEY=re_xxx
# Without it, isMailConfigured() is false: requests still save, the send is just
# skipped with a logged warning. From/reply-to can be overridden with the
# MAIL_FROM / MAIL_REPLY_TO / LAB_INBOX secrets (defaults are fine).
#
# Job-request artwork storage (Tigris object storage). Provision once:
#   fly storage create        # pick this app; it injects the AWS_* + BUCKET_NAME secrets
# Without those, isStorageConfigured() is false: text-only requests still save,
# but a request WITH files attached is refused with a 503.

app = 'cgl-website'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/cgl.db'
  PORT = '8080'

[[mounts]]
  source = 'cgl_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
