<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
            <div class="contact-buttons">
                <a href="mailto:contact@madein.school" class="btn">
                    <span class="material-symbols-outlined">mail</span> Email
                </a>
                <a href="tel:18605132398" class="btn">
                    <span class="material-symbols-outlined">call</span> Call
                </a>
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
        </nav>
    </div>

    <main class="form-container">
        <div class="order-form" style="text-align:center;">
            <h2>Sign In</h2>
            <p id="signin-copy">Sign in with your hartfordschools.org or students.hartfordschools.org account to continue.</p>

            <p id="signin-status" style="display:none;color:#c0392b;font-weight:600;margin-bottom:20px;"></p>

            <button type="button" id="signin-btn" class="submit-btn" disabled>
                <span class="material-symbols-outlined">login</span>
                Sign In with Google
            </button>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script>
        function nextUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('next') || '/';
        }

        document.getElementById('signin-btn').addEventListener('click', requestSignIn);

        // Poll briefly for GIS to finish loading before enabling the button.
        const enableCheck = setInterval(() => {
            if (typeof gisInited !== 'undefined' && gisInited) {
                document.getElementById('signin-btn').disabled = false;
                clearInterval(enableCheck);
            }
        }, 100);

        window.onAuthReady = function (session) {
            if (session) window.location.href = nextUrl();
        };

        window.onAuthError = function (message) {
            const el = document.getElementById('signin-status');
            el.innerText = message;
            el.style.display = '';
        };
    </script>
</body>

</html>
