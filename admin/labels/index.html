<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Label Sheets</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Tools</a>
            <a href="/admin/orders/" class="nav-tab staff-only" hidden>Orders</a>
            <a href="/admin/items/" class="nav-tab staff-only" hidden>Item Catalog</a>
            <a href="/admin/restock/" class="nav-tab staff-only" hidden>Restock</a>
            <a href="/admin/storefront/" class="nav-tab staff-only" hidden>Storefront</a>
            <a href="/admin/transactions/" class="nav-tab staff-only" hidden>Transactions</a>
        </nav>
    </div>

    <main class="staff-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div id="staff-ui" style="display:none;">
            <div class="labels-controls">
                <div>
                    <h1>QR Label Sheets</h1>
                    <p id="labels-summary" class="placeholder-text">Building sheets&hellip;</p>
                </div>
                <div class="labels-actions">
                    <label class="variant-toggle">
                        <input type="checkbox" id="include-inactive"> Include inactive items
                    </label>
                    <button type="button" id="print-btn" class="submit-btn">
                        <span class="material-symbols-outlined">print</span>
                        Print
                    </button>
                </div>
            </div>

            <div id="sheets"></div>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/staff-guard.js"></script>
    <script src="/scripts/vendor/qrcode.min.js"></script>
    <script>
        requireStaffSession(() => {
            // Grid geometry. 4 x 6 = 24 labels per Letter page.
            const COLS = 4;
            const ROWS = 6;
            const PER_PAGE = COLS * ROWS;

            // Category print order; anything unexpected sorts after these, A-Z.
            const CATEGORY_ORDER = ['School Store', 'Athletics', 'GFX'];
            const SIZE_ORDER = ['XXXS', 'XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'XXXXL', '2XL', '3XL', '4XL', '5XL'];

            const sheetsEl = document.getElementById('sheets');
            const summaryEl = document.getElementById('labels-summary');

            function categoryRank(name) {
                const i = CATEGORY_ORDER.indexOf(name);
                return i === -1 ? CATEGORY_ORDER.length : i;
            }

            function sizeRank(raw) {
                const key = String(raw || '').toUpperCase().replace(/\s+/g, '');
                const i = SIZE_ORDER.indexOf(key);
                return i === -1 ? SIZE_ORDER.length : i;
            }

            function compareItems(a, b) {
                return (
                    a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }) ||
                    String(a.variant_color || '').localeCompare(String(b.variant_color || '')) ||
                    (sizeRank(a.variant_size) - sizeRank(b.variant_size)) ||
                    String(a.variant_size || '').localeCompare(String(b.variant_size || ''))
                );
            }

            function qrSvg(text) {
                const q = qrcode(0, 'M');
                q.addData(text);
                q.make();
                return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
            }

            function variantLine(item) {
                return [item.variant_color, item.variant_size].filter(Boolean).join('  /  ');
            }

            function render(items) {
                sheetsEl.innerHTML = '';

                // Group by category, then by sub-category within it; each leaf
                // group alphabetised. Items with no sub-category sort last.
                const groups = new Map();
                for (const item of items) {
                    if (!groups.has(item.category)) groups.set(item.category, new Map());
                    const subMap = groups.get(item.category);
                    const sub = item.subcategory || '';
                    if (!subMap.has(sub)) subMap.set(sub, []);
                    subMap.get(sub).push(item);
                }
                const orderedCats = [...groups.keys()].sort(
                    (a, b) => categoryRank(a) - categoryRank(b) || a.localeCompare(b)
                );

                let sheetCount = 0;
                let groupCount = 0;
                for (const cat of orderedCats) {
                    const subMap = groups.get(cat);
                    const orderedSubs = [...subMap.keys()].sort((a, b) => {
                        if (!a) return 1;
                        if (!b) return -1;
                        return a.localeCompare(b);
                    });

                    for (const sub of orderedSubs) {
                        groupCount++;
                        const catItems = subMap.get(sub).sort(compareItems);
                        const pages = Math.ceil(catItems.length / PER_PAGE) || 1;
                        const heading = sub ? `${cat} — ${sub}` : cat;

                        for (let p = 0; p < pages; p++) {
                            sheetCount++;
                            const pageItems = catItems.slice(p * PER_PAGE, (p + 1) * PER_PAGE);

                            const sheet = document.createElement('section');
                            sheet.className = 'sheet';

                            const head = document.createElement('div');
                            head.className = 'sheet-header';
                            head.innerHTML = `<span>${heading}</span><span>${p + 1} / ${pages}</span>`;
                            sheet.appendChild(head);

                            const grid = document.createElement('div');
                            grid.className = 'label-grid';
                            grid.style.setProperty('--cols', COLS);

                            for (const item of pageItems) {
                                const cell = document.createElement('div');
                                cell.className = 'label-cell';
                                cell.innerHTML = `
                                    <div class="label-qr">${qrSvg(item.uuid)}</div>
                                    <div class="label-name">${item.name}</div>
                                    <div class="label-variant">${variantLine(item) || '&nbsp;'}</div>
                                    <div class="label-uuid">${item.uuid}</div>
                                `;
                                grid.appendChild(cell);
                            }
                            sheet.appendChild(grid);
                            sheetsEl.appendChild(sheet);
                        }
                    }
                }

                summaryEl.textContent = items.length
                    ? `${items.length} item${items.length === 1 ? '' : 's'} across ${groupCount} group${groupCount === 1 ? '' : 's'} — ${sheetCount} page${sheetCount === 1 ? '' : 's'}.`
                    : 'No items to print.';
            }

            let allItems = [];
            function apply() {
                const includeInactive = document.getElementById('include-inactive').checked;
                render(allItems.filter((it) => includeInactive || it.active));
            }

            document.getElementById('include-inactive').addEventListener('change', apply);
            document.getElementById('print-btn').addEventListener('click', () => window.print());

            (async () => {
                try {
                    const res = await authFetch('/api/items/admin');
                    if (!res.ok) throw new Error('request failed');
                    allItems = await res.json();
                    apply();
                } catch (err) {
                    console.error('Failed to load items:', err);
                    summaryEl.textContent = 'Could not load items. Please refresh.';
                }
            })();
        });
    </script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
