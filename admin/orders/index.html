<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Tools</a>
            <a href="/admin/orders/" class="nav-tab staff-only" hidden>Orders</a>
            <a href="/admin/requests/" class="nav-tab staff-only" hidden>Job Requests</a>
            <a href="/admin/items/" class="nav-tab staff-only" hidden>Item Catalog</a>
            <a href="/admin/restock/" class="nav-tab staff-only" hidden>Restock</a>
            <a href="/admin/storefront/" class="nav-tab staff-only" hidden>Storefront</a>
            <a href="/admin/transactions/" class="nav-tab staff-only" hidden>Transactions</a>
        </nav>
    </div>

    <main class="staff-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div id="staff-ui" style="display:none;">
            <h1>Orders</h1>

            <div class="tab-bar">
                <button type="button" class="tab active" data-tab="orders">Orders</button>
                <button type="button" class="tab" data-tab="jerseys">Jersey Rosters</button>
            </div>

            <section id="tab-orders">
                <div class="form-group" style="max-width:250px;">
                    <label for="status-filter">Filter by Status</label>
                    <select id="status-filter">
                        <option value="">All</option>
                        <option value="new">New</option>
                        <option value="in_progress">In Progress</option>
                        <option value="fulfilled">Fulfilled</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>

                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Placed</th>
                                <th>Customer</th>
                                <th>Student ID</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-jerseys" hidden>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Job Name</th>
                                <th>Coach</th>
                                <th>Style</th>
                                <th>Players</th>
                                <th>Updated</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="jerseys-tbody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/staff-guard.js"></script>
    <script>
        requireStaffSession(() => {
            const STATUSES = ['new', 'in_progress', 'fulfilled', 'cancelled'];
            const PAY_LABELS = {
                paid: 'Paid', unpaid: 'Unpaid', refunded: 'Refunded',
                free: 'No charge', legacy: 'Pre-online',
            };

            function payBadge(status) {
                const label = PAY_LABELS[status] || status || '—';
                return `<span class="status-badge pay-${status}">${label}</span>`;
            }

            async function updateStatus(orderId, status, paymentStatus) {
                if (status === 'cancelled' && paymentStatus === 'paid' &&
                    !confirm('Cancelling this order will issue a full refund to the customer through Stripe. Continue?')) {
                    loadOrders(); // reset the dropdown
                    return;
                }
                const res = await authFetch(`/api/orders/${orderId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status }),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert(err.error || 'Could not update the order.');
                }
                loadOrders();
            }
            window.updateStatus = updateStatus;

            async function loadOrders() {
                const filter = document.getElementById('status-filter').value;
                const res = await authFetch(`/api/orders${filter ? `?status=${filter}` : ''}`);
                const orders = await res.json();
                const tbody = document.getElementById('orders-tbody');

                tbody.innerHTML = orders.map((order) => {
                    const itemsSummary = order.items.map((i) =>
                        `${i.qty}x ${i.item_name} (${[i.variant_color, i.variant_size].filter(Boolean).join('/')})`
                    ).join('<br>');
                    const statusOptions = STATUSES.map((s) =>
                        `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s.replace('_', ' ')}</option>`
                    ).join('');

                    return `
                        <tr>
                            <td>${new Date(order.created_at).toLocaleString()}</td>
                            <td>${order.customer_name}<br><small>${order.email}</small></td>
                            <td>${order.student_id || '—'}</td>
                            <td>${itemsSummary}</td>
                            <td>$${(order.total_cents / 100).toFixed(2)}</td>
                            <td>${payBadge(order.payment_status)}</td>
                            <td>
                                <select onchange="updateStatus(${order.id}, this.value, '${order.payment_status}')">
                                    ${statusOptions}
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="7" class="placeholder-text">No orders yet.</td></tr>';
            }

            document.getElementById('status-filter').addEventListener('change', loadOrders);
            loadOrders();

            // ---- Jersey Rosters tab -------------------------------------
            const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
            ));
            let jerseysLoaded = false;

            async function loadJerseys() {
                const res = await authFetch('/api/jerseys');
                const jobs = res.ok ? await res.json() : [];
                const tbody = document.getElementById('jerseys-tbody');
                tbody.innerHTML = jobs.map((j) => `
                    <tr data-id="${j.id}">
                        <td><button type="button" class="link-btn j-expand">${esc(j.job_name)}</button></td>
                        <td><small>${esc(j.email)}</small></td>
                        <td>${j.jersey_style === 'female' ? 'Female' : 'Male'}</td>
                        <td>${j.players.length}</td>
                        <td>${new Date(j.updated_at).toLocaleDateString()}</td>
                        <td>
                            <button type="button" class="link-btn j-csv">CSV</button>
                            <button type="button" class="link-btn j-delete" style="color:#c0392b;">Delete</button>
                        </td>
                    </tr>
                `).join('') || '<tr><td colspan="6" class="placeholder-text">No rosters yet.</td></tr>';
                window._jerseys = jobs;
            }

            document.getElementById('jerseys-tbody').addEventListener('click', async (e) => {
                const tr = e.target.closest('tr');
                if (!tr || !tr.dataset.id) return;
                const id = tr.dataset.id;
                const job = (window._jerseys || []).find((j) => String(j.id) === id);

                if (e.target.classList.contains('j-expand')) {
                    const next = tr.nextElementSibling;
                    if (next && next.classList.contains('j-detail')) { next.remove(); return; }
                    const rows = job.players.map((p) =>
                        `<tr><td>${esc(p.name)}</td><td>${esc(p.number)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${esc(p.info)}</td></tr>`
                    ).join('');
                    tr.insertAdjacentHTML('afterend',
                        `<tr class="j-detail"><td colspan="6"><table class="admin-table" style="margin:0;">
                        <thead><tr><th>Name on Jersey</th><th>Number</th><th>Size</th><th>Color</th><th>Additional Info</th></tr></thead>
                        <tbody>${rows}</tbody></table></td></tr>`);
                } else if (e.target.classList.contains('j-csv')) {
                    const res = await authFetch(`/api/jerseys/${id}/export.csv`);
                    if (!res.ok) { alert('Could not download CSV.'); return; }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `jerseys-${(job.job_name || 'roster').replace(/[^\w]+/g, '-').toLowerCase()}.csv`;
                    document.body.appendChild(a); a.click(); a.remove();
                    URL.revokeObjectURL(url);
                } else if (e.target.classList.contains('j-delete')) {
                    if (!confirm(`Delete roster "${job.job_name}"? This cannot be undone.`)) return;
                    const res = await authFetch(`/api/jerseys/${id}`, { method: 'DELETE' });
                    if (!res.ok) { alert('Could not delete.'); return; }
                    loadJerseys();
                }
            });

            document.querySelectorAll('.tab-bar .tab').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-bar .tab').forEach((b) => b.classList.toggle('active', b === btn));
                    const tab = btn.dataset.tab;
                    document.getElementById('tab-orders').hidden = tab !== 'orders';
                    document.getElementById('tab-jerseys').hidden = tab !== 'jerseys';
                    if (tab === 'jerseys' && !jerseysLoaded) { jerseysLoaded = true; loadJerseys(); }
                });
            });
        });
    </script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
