<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Catalog</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Tools</a>
            <a href="/admin/orders/" class="nav-tab staff-only" hidden>Orders</a>
            <a href="/admin/items/" class="nav-tab staff-only" hidden>Item Catalog</a>
            <a href="/admin/restock/" class="nav-tab staff-only" hidden>Restock</a>
            <a href="/admin/storefront/" class="nav-tab staff-only" hidden>Storefront</a>
        </nav>
    </div>

    <main class="staff-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div id="staff-ui" style="display:none;">
            <h1>Item Catalog</h1>

            <div class="config-card">
                <h2>Add New Item</h2>
                <div class="form-group">
                    <label for="item-name">Name</label>
                    <input type="text" id="item-name" placeholder="e.g. CGL Water Bottle" required>
                </div>
                <div class="form-group">
                    <label for="item-category">Category</label>
                    <input type="text" id="item-category" placeholder="General" value="General">
                </div>
                <div class="form-group">
                    <label for="item-uuid">UUID (leave blank to auto-generate)</label>
                    <input type="text" id="item-uuid" placeholder="Auto-generated if left blank">
                    <small id="uuid-lock-note" class="field-note" style="display:none;">
                        Locked to auto-generate while adding colors or sizes &mdash; each variant gets its own UUID.
                    </small>
                </div>
                <div class="form-group">
                    <label for="item-price">Price (USD)</label>
                    <input type="number" id="item-price" min="0" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="item-stock">Starting Stock</label>
                    <input type="number" id="item-stock" min="0" step="1" value="0">
                </div>

                <div class="variant-toggles">
                    <label class="variant-toggle">
                        <input type="checkbox" id="toggle-colors"> Add Colors
                    </label>
                    <label class="variant-toggle">
                        <input type="checkbox" id="toggle-sizes"> Add Sizes
                    </label>
                </div>

                <div class="variant-panel" id="colors-panel" hidden>
                    <span class="variant-panel-label">Colors</span>
                    <div class="color-adder">
                        <input type="text" id="color-input" placeholder="e.g. Forest Green" autocomplete="off">
                        <button type="button" id="add-color-btn" class="secondary-btn">Add</button>
                    </div>
                    <div class="chip-list" id="color-chip-list"></div>
                </div>

                <div class="variant-panel" id="sizes-panel" hidden>
                    <div class="variant-panel-head">
                        <span class="variant-panel-label">Sizes</span>
                        <button type="button" id="sizes-all-btn" class="link-btn">Select all</button>
                        <button type="button" id="sizes-none-btn" class="link-btn">Clear</button>
                    </div>
                    <div class="checkbox-grid" id="size-checkbox-grid"></div>
                </div>

                <p id="variant-summary" class="field-note" style="display:none;"></p>
                <p id="add-result" style="display:none;font-weight:600;"></p>
                <button type="button" id="add-item-btn" class="secondary-btn">Add Item</button>
            </div>

            <h2 style="margin-top:40px;">Catalog</h2>
            <div style="overflow-x:auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Variant</th>
                            <th>UUID</th>
                            <th>Price</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="items-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/staff-guard.js"></script>
    <script>
        requireStaffSession(() => {
            async function loadItems() {
                const res = await authFetch('/api/items/admin');
                const items = await res.json();
                const tbody = document.getElementById('items-tbody');
                tbody.innerHTML = items.map((item) => `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>${[item.variant_color, item.variant_size].filter(Boolean).join(' / ') || '—'}</td>
                        <td><code>${item.uuid}</code></td>
                        <td>$${(item.price_cents / 100).toFixed(2)}</td>
                        <td>${item.stock_qty}</td>
                    </tr>
                `).join('') || '<tr><td colspan="6" class="placeholder-text">No items yet.</td></tr>';
            }

            const SIZES = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL', '4XL', '5XL'];
            const colors = [];
            const $ = (id) => document.getElementById(id);

            // "forest green" / "NAVY blue" -> "Forest Green" / "Navy Blue"
            function normalizeColor(raw) {
                return String(raw)
                    .trim()
                    .replace(/\s+/g, ' ')
                    .toLowerCase()
                    .replace(/(^|[\s\-/])([a-z])/g, (_, sep, ch) => sep + ch.toUpperCase());
            }

            $('size-checkbox-grid').innerHTML = SIZES.map((s) => `
                <label class="checkbox-item">
                    <input type="checkbox" class="size-check" value="${s}"> ${s}
                </label>
            `).join('');

            function selectedSizes() {
                return $('toggle-sizes').checked
                    ? [...document.querySelectorAll('.size-check:checked')].map((c) => c.value)
                    : [];
            }

            function enteredColors() {
                return $('toggle-colors').checked ? colors.slice() : [];
            }

            function bulkActive() {
                return $('toggle-colors').checked || $('toggle-sizes').checked;
            }

            function updateUuidLock() {
                const uuid = $('item-uuid');
                const locked = bulkActive();
                uuid.disabled = locked;
                if (locked) uuid.value = '';
                $('uuid-lock-note').style.display = locked ? '' : 'none';
            }

            function updateVariantSummary() {
                const el = $('variant-summary');
                if (!bulkActive()) { el.style.display = 'none'; return; }
                const nColors = enteredColors().length;
                const nSizes = selectedSizes().length;
                const count = Math.max(1, nColors) * Math.max(1, nSizes);
                const parts = [];
                if (nColors) parts.push(`${nColors} color${nColors === 1 ? '' : 's'}`);
                if (nSizes) parts.push(`${nSizes} size${nSizes === 1 ? '' : 's'}`);
                el.textContent = parts.length
                    ? `Will create ${count} item${count === 1 ? '' : 's'} (${parts.join(' × ')}).`
                    : 'Add at least one color or size, or switch the toggles off.';
                el.style.display = '';
            }

            function renderColorChips() {
                const list = $('color-chip-list');
                list.innerHTML = colors.map((c, i) => `
                    <span class="chip">${c}<button type="button" data-i="${i}" aria-label="Remove ${c}">&times;</button></span>
                `).join('');
                list.querySelectorAll('button').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        colors.splice(Number(btn.dataset.i), 1);
                        renderColorChips();
                        updateVariantSummary();
                    });
                });
            }

            function addColorFromInput() {
                const input = $('color-input');
                const value = normalizeColor(input.value);
                if (value && !colors.some((c) => c.toLowerCase() === value.toLowerCase())) colors.push(value);
                input.value = '';
                input.focus();
                renderColorChips();
                updateVariantSummary();
            }

            $('toggle-colors').addEventListener('change', () => {
                $('colors-panel').hidden = !$('toggle-colors').checked;
                updateUuidLock();
                updateVariantSummary();
            });
            $('toggle-sizes').addEventListener('change', () => {
                $('sizes-panel').hidden = !$('toggle-sizes').checked;
                updateUuidLock();
                updateVariantSummary();
            });
            $('add-color-btn').addEventListener('click', addColorFromInput);
            $('color-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addColorFromInput(); }
            });
            $('size-checkbox-grid').addEventListener('change', updateVariantSummary);
            $('sizes-all-btn').addEventListener('click', () => {
                document.querySelectorAll('.size-check').forEach((c) => { c.checked = true; });
                updateVariantSummary();
            });
            $('sizes-none-btn').addEventListener('click', () => {
                document.querySelectorAll('.size-check').forEach((c) => { c.checked = false; });
                updateVariantSummary();
            });

            $('add-item-btn').addEventListener('click', async () => {
                const resultEl = $('add-result');
                resultEl.style.display = 'none';

                const name = $('item-name').value.trim();
                if (!name) { $('item-name').focus(); return; }

                const category = $('item-category').value.trim() || 'General';
                const priceCents = Math.round(parseFloat($('item-price').value || '0') * 100);
                const startingStock = parseInt($('item-stock').value || '0');

                const useColors = enteredColors();
                const useSizes = selectedSizes();
                const bulk = bulkActive() && (useColors.length > 0 || useSizes.length > 0);

                let res;
                if (bulk) {
                    res = await authFetch('/api/items/bulk', {
                        method: 'POST',
                        body: JSON.stringify({ name, category, priceCents, startingStock, colors: useColors, sizes: useSizes }),
                    });
                } else {
                    res = await authFetch('/api/items', {
                        method: 'POST',
                        body: JSON.stringify({ name, category, uuid: $('item-uuid').value.trim(), priceCents, startingStock }),
                    });
                }
                const data = await res.json();

                resultEl.style.display = '';
                if (res.ok) {
                    resultEl.style.color = '#27ae60';
                    resultEl.innerText = bulk
                        ? `Added ${data.count} item${data.count === 1 ? '' : 's'} for "${name}".`
                        : `Added "${data.name}" — UUID: ${data.uuid}`;
                    $('item-name').value = '';
                    $('item-uuid').value = '';
                    $('item-price').value = '0';
                    $('item-stock').value = '0';
                    loadItems();
                } else {
                    resultEl.style.color = '#c0392b';
                    resultEl.innerText = data.error || 'Failed to add item.';
                }
            });

            renderColorChips();
            updateUuidLock();
            loadItems();
        });
    </script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
