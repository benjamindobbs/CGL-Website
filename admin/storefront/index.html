<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Storefront Sale</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body class="form-page">
    <div class="nav-container">
        <header>
            <div class="logo">
                <img src="/assets/CGL-Logo.svg" alt="Classical Graphics Lab">
            </div>
        </header>
        <nav class="navbar">
            <a href="/" class="nav-tab">Home</a>
            <a href="/info/" class="nav-tab">Information</a>
            <a href="/order/" class="nav-tab">Quick Order</a>
            <a href="/admin/" class="nav-tab staff-only" hidden>Staff Tools</a>
            <a href="/admin/orders/" class="nav-tab staff-only" hidden>Orders</a>
            <a href="/admin/items/" class="nav-tab staff-only" hidden>Item Catalog</a>
            <a href="/admin/restock/" class="nav-tab staff-only" hidden>Restock</a>
            <a href="/admin/storefront/" class="nav-tab staff-only" hidden>Storefront</a>
        </nav>
    </div>

    <main class="form-container">
        <p id="loading-status" class="placeholder-text">Checking sign-in&hellip;</p>

        <div class="order-form" id="staff-ui" style="display:none;">
            <h2>Storefront Sale</h2>
            <p>Scan (or type) an item's UUID to remove it from stock. Quantity defaults to 1.</p>

            <div class="form-group">
                <label for="uuid">Item UUID</label>
                <div class="input-with-action">
                    <input type="text" id="uuid" placeholder="Scan QR or type UUID" autofocus>
                    <button type="button" id="scan-btn" class="secondary-btn scan-btn">
                        <span class="material-symbols-outlined">qr_code_scanner</span>
                        Scan
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Quantity Sold</label>
                <div class="quantity-controls">
                    <button type="button" id="qty-minus">−</button>
                    <input type="number" id="qty" value="1" min="1">
                    <button type="button" id="qty-plus">+</button>
                </div>
            </div>

            <p id="result" style="display:none;font-weight:600;"></p>

            <button type="button" id="sale-btn" class="submit-btn">
                <span class="material-symbols-outlined">point_of_sale</span>
                Remove from Stock
            </button>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/staff-guard.js"></script>
    <script src="/scripts/vendor/jsQR.min.js"></script>
    <script src="/scripts/qr-scan.js"></script>
    <script>
        requireStaffSession(() => {
            const uuidInput = document.getElementById('uuid');
            const qtyInput = document.getElementById('qty');
            const resultEl = document.getElementById('result');

            document.getElementById('scan-btn').addEventListener('click', () => {
                resultEl.style.display = 'none';
                scanQr().then((text) => {
                    uuidInput.value = text;
                    qtyInput.focus();
                }).catch((err) => {
                    if (err.reason === 'cancel') return;
                    resultEl.style.display = '';
                    resultEl.style.color = '#c0392b';
                    resultEl.innerText = err.message || 'Could not scan.';
                });
            });

            document.getElementById('qty-minus').addEventListener('click', () => {
                const v = parseInt(qtyInput.value) - 1;
                if (v >= 1) qtyInput.value = v;
            });
            document.getElementById('qty-plus').addEventListener('click', () => {
                qtyInput.value = parseInt(qtyInput.value) + 1;
            });

            async function submitSale() {
                const uuid = uuidInput.value.trim();
                const qty = parseInt(qtyInput.value);
                resultEl.style.display = 'none';

                if (!uuid) { uuidInput.focus(); return; }
                if (!Number.isInteger(qty) || qty <= 0) { qtyInput.focus(); return; }

                const res = await authFetch('/api/inventory/storefront-sale', {
                    method: 'POST',
                    body: JSON.stringify({ uuid, qty }),
                });
                const data = await res.json();

                resultEl.style.display = '';
                if (res.ok) {
                    resultEl.style.color = '#27ae60';
                    resultEl.innerText = `${data.name} (${[data.variant_color, data.variant_size].filter(Boolean).join(' / ')}) is now at ${data.stock_qty} in stock.`;
                    uuidInput.value = '';
                    qtyInput.value = 1;
                } else {
                    resultEl.style.color = '#c0392b';
                    resultEl.innerText = data.error || 'Sale failed.';
                }
                uuidInput.focus();
            }

            document.getElementById('sale-btn').addEventListener('click', submitSale);
            uuidInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitSale(); } });
        });
    </script>
    <script src="/scripts/nav-auth.js"></script>
</body>

</html>
